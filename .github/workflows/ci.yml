name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Check manifest
        run: jq -e '.manifest_version == 3 and (.version | test("^[0-9]+(\\.[0-9]+)*$"))' manifest.json

      - name: Check JavaScript syntax
        run: |
          for file in src/*.js; do
            node --check "$file"
          done

      - name: Lint extension
        run: bunx --bun web-ext lint --source-dir . --warnings-as-errors
