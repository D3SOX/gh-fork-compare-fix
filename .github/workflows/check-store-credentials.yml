name: Check Chrome Web Store credentials

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
      PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
      CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
      CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
      REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
    steps:
      - name: Check credentials
        run: |
          node --input-type=module <<'EOF'
          const required = ['EXTENSION_ID', 'PUBLISHER_ID', 'CLIENT_ID', 'CLIENT_SECRET', 'REFRESH_TOKEN'];
          const missing = required.filter((name) => !process.env[name]);

          if (missing.length > 0) {
            throw new Error(`Missing secrets: ${missing.join(', ')}`);
          }

          const tokenResponse = await fetch('https://oauth2.googleapis.com/token', {
            method: 'POST',
            headers: { 'content-type': 'application/x-www-form-urlencoded' },
            body: new URLSearchParams({
              client_id: process.env.CLIENT_ID,
              client_secret: process.env.CLIENT_SECRET,
              refresh_token: process.env.REFRESH_TOKEN,
              grant_type: 'refresh_token',
            }),
          });

          if (!tokenResponse.ok) {
            throw new Error(`OAuth token exchange failed (${tokenResponse.status})`);
          }

          const { access_token: accessToken } = await tokenResponse.json();
          const publisherId = encodeURIComponent(process.env.PUBLISHER_ID);
          const extensionId = encodeURIComponent(process.env.EXTENSION_ID);
          const statusResponse = await fetch(
            `https://chromewebstore.googleapis.com/v2/publishers/${publisherId}/items/${extensionId}:fetchStatus`,
            { headers: { authorization: `Bearer ${accessToken}` } },
          );

          if (!statusResponse.ok) {
            throw new Error(`Chrome Web Store access check failed (${statusResponse.status})`);
          }

          console.log('Chrome Web Store credentials are valid and can access the extension.');
          EOF
