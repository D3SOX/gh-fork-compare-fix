name: Check store credentials

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chrome:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
      PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
      CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
      CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
      REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
    steps:
      - name: Check credentials
        run: |
          node --input-type=module <<'EOF'
          const required = ['EXTENSION_ID', 'PUBLISHER_ID', 'CLIENT_ID', 'CLIENT_SECRET', 'REFRESH_TOKEN'];
          const missing = required.filter((name) => !process.env[name]);

          if (missing.length > 0) {
            throw new Error(`Missing secrets: ${missing.join(', ')}`);
          }

          const tokenResponse = await fetch('https://oauth2.googleapis.com/token', {
            method: 'POST',
            headers: { 'content-type': 'application/x-www-form-urlencoded' },
            body: new URLSearchParams({
              client_id: process.env.CLIENT_ID,
              client_secret: process.env.CLIENT_SECRET,
              refresh_token: process.env.REFRESH_TOKEN,
              grant_type: 'refresh_token',
            }),
          });

          if (!tokenResponse.ok) {
            throw new Error(`OAuth token exchange failed (${tokenResponse.status})`);
          }

          const { access_token: accessToken } = await tokenResponse.json();
          const publisherId = encodeURIComponent(process.env.PUBLISHER_ID);
          const extensionId = encodeURIComponent(process.env.EXTENSION_ID);
          const statusResponse = await fetch(
            `https://chromewebstore.googleapis.com/v2/publishers/${publisherId}/items/${extensionId}:fetchStatus`,
            { headers: { authorization: `Bearer ${accessToken}` } },
          );

          if (!statusResponse.ok) {
            throw new Error(`Chrome Web Store access check failed (${statusResponse.status})`);
          }

          console.log('Chrome Web Store credentials are valid and can access the extension.');
          EOF

  amo:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
      JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
    steps:
      - name: Check credentials
        run: |
          node --input-type=module <<'EOF'
          import { createHmac, randomUUID } from 'node:crypto';

          if (!process.env.JWT_ISSUER || !process.env.JWT_SECRET) {
            throw new Error('Missing secrets: AMO_JWT_ISSUER and/or AMO_JWT_SECRET');
          }

          const encode = (value) => Buffer.from(JSON.stringify(value)).toString('base64url');
          const issuedAt = Math.floor(Date.now() / 1000);
          const unsignedToken = [
            encode({ alg: 'HS256', typ: 'JWT' }),
            encode({
              iss: process.env.JWT_ISSUER,
              jti: randomUUID(),
              iat: issuedAt,
              exp: issuedAt + 60,
            }),
          ].join('.');
          const signature = createHmac('sha256', process.env.JWT_SECRET)
            .update(unsignedToken)
            .digest('base64url');
          const token = `${unsignedToken}.${signature}`;

          const profileResponse = await fetch('https://addons.mozilla.org/api/v5/accounts/profile/', {
            headers: { authorization: `JWT ${token}` },
          });

          if (!profileResponse.ok) {
            throw new Error(`AMO access check failed (${profileResponse.status})`);
          }

          console.log('AMO credentials are valid and can access the developer profile.');
          EOF
